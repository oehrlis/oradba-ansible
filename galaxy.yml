namespace: oradba
name: automation
version: 0.2.0
readme: README.md
authors:
  - Stefan Oehrli <stefan.oehrli@oradba.ch>
description: >-
  Ansible roles and playbooks for Oracle Database software on Linux - OS users and layout, the odb_autoupgrade
  engine, MOS keystore, patch download and Oracle Home creation. AutoUpgrade is called only through the engine.
license:
  - Apache-2.0
tags:
  - oracle
  - database
  - autoupgrade
  - patching
  - linux
dependencies: {}
repository: https://github.com/oehrlis/oradba-ansible
documentation: https://github.com/oehrlis/oradba-ansible/tree/main/docs
homepage: https://github.com/oehrlis/oradba-ansible
issues: https://github.com/oehrlis/oradba-ansible/issues
build_ignore:
  - .git
  - .github
  - .venv
  - .collections
  - .claude
  - .gitignore
  - .ansible
  - tasks
  - dist
  - extensions
  - requirements-dev.txt
  - Makefile
  - CLAUDE.md
  - "*.tar.gz"
