---
name: gitleaks

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          v=8.28.0
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL "${base}/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --verbose .
